services:
  api:
    build:
      context: .
      dockerfile: src/TradeViewer.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Default: Data Source=/data/tradeviewer.db
    volumes:
      - sqlite_data:/data
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sqlite_data:
